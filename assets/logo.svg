<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" fill="none">
  <style>
    .brand-text-main { fill: #0f172a; }
    .brand-text-sub { fill: #64748b; }
    .brand-divider { fill: #cbd5e1; }
    @media (prefers-color-scheme: dark) {
      .brand-text-main { fill: #ffffff; }
      .brand-text-sub { fill: #94a3b8; }
      .brand-divider { fill: #334155; }
    }
  </style>
  
  <!-- Sleek Iconic Geometric Mark: ANC Delta Compass -->
  <g transform="translate(6, 8)">
    <defs>
      <linearGradient id="ancIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06b6d4" />
        <stop offset="60%" stop-color="#2563eb" />
        <stop offset="100%" stop-color="#4f46e5" />
      </linearGradient>
      <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.3"/>
      </filter>
    </defs>
    
    <!-- Outer Precision Delta -->
    <path d="M20 2L38 36H28.5L20 18.5L11.5 36H2L20 2Z" fill="url(#ancIconGrad)" filter="url(#subtleGlow)"/>
    
    <!-- Core Focal Node -->
    <circle cx="20" cy="27" r="3.5" fill="#06b6d4"/>
    <circle cx="20" cy="27" r="1.5" fill="#ffffff"/>
  </g>
  
  <!-- Brand Typography -->
  <text x="56" y="35" class="brand-text-main" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-weight="900" font-size="24" letter-spacing="-0.03em">ANC</text>
  <text x="114" y="34" class="brand-divider" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-weight="300" font-size="18">|</text>
  <text x="128" y="33" class="brand-text-sub" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="0.12em">ASEEM &amp; CONSULTING</text>
</svg>
