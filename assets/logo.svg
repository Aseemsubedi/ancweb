<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none">
  <style>
    .anc-emblem { fill: #005ca3; }
    .anc-text-primary { fill: #005ca3; }
    @media (prefers-color-scheme: dark) {
      .anc-emblem { fill: #06b6d4; }
      .anc-text-primary { fill: #ffffff; }
    }
  </style>

  <!-- Official Authorized Emblem -->
  <g transform="translate(10, 10) scale(1.05)">
    <!-- Top Ribbon -->
    <path d="M18 2 L42 26 L56 12 L32 -12 Z" class="anc-emblem" transform="translate(0, 15)"/>
    <!-- Bottom Ribbon -->
    <path d="M2 38 L26 62 L40 48 L16 24 Z" class="anc-emblem" transform="translate(0, 15)"/>
  </g>

  <!-- Official Typography: ASEEM & CONSULTING -->
  <g transform="translate(100, 20)">
    <text x="0" y="32" class="anc-text-primary" font-family="'Inter', 'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="0.02em">ASEEM &amp;</text>
    <text x="0" y="70" class="anc-text-primary" font-family="'Inter', 'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="0.02em">CONSULTING</text>
  </g>
</svg>
